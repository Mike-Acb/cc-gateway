log_format gateway '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                   'xff="$http_x_forwarded_for" upstream="$upstream_addr" '
                   'upstream_status="$upstream_status" request_time="$request_time" '
                   'upstream_time="$upstream_response_time"';

upstream cc_gateway_backends {
    least_conn;
    server gateway-1:8443 max_fails=3 fail_timeout=10s;
    server gateway-2:8443 max_fails=3 fail_timeout=10s;
    server gateway-3:8443 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 18443;
    server_name _;

    access_log /var/log/nginx/access.log gateway;
    error_log /var/log/nginx/error.log warn;

    client_max_body_size 100m;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location / {
        proxy_http_version 1.1;
        proxy_pass http://cc_gateway_backends;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
