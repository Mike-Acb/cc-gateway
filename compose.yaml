name: cc-gateway-lb

x-gateway-common: &gateway-common
  build: .
  restart: unless-stopped
  expose:
    - "8443"
  volumes:
    - type: bind
      source: ./config.yaml
      target: /app/config.yaml
      read_only: true
      bind:
        create_host_path: false
  command:
    - /bin/sh
    - -lc
    - mkdir -p /var/log/cc-gateway && exec node dist/index.js /app/config.yaml >> /var/log/cc-gateway/gateway.log 2>&1
  healthcheck:
    test:
      - CMD-SHELL
      - node -e "fetch('http://localhost:8443/_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 15s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cc_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-cc_gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-password}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - /bin/sh
      - -c
      - if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"; else exec redis-server --appendonly yes; fi
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - if [ -n "$${REDIS_PASSWORD}" ]; then redis-cli -a "$${REDIS_PASSWORD}" ping; else redis-cli ping; fi
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    image: postgres:15
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-cc_gateway}
      PGUSER: ${POSTGRES_USER:-cc_gateway}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me-password}
    volumes:
      - ./migrations:/migrations:ro
    command:
      - /bin/sh
      - -ec
      - |
        psql -v ON_ERROR_STOP=1 -c 'CREATE TABLE IF NOT EXISTS schema_migrations (filename TEXT PRIMARY KEY, applied_at TIMESTAMPTZ NOT NULL DEFAULT now())'
        for f in /migrations/*.sql; do
          name="$$(basename "$$f")"
          if [ "$$(psql -tAc "SELECT 1 FROM schema_migrations WHERE filename = '$$name'")" = "1" ]; then
            echo "skip $$name"
            continue
          fi
          echo "apply $$name"
          psql -v ON_ERROR_STOP=1 -f "$$f"
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO schema_migrations (filename) VALUES ('$$name') ON CONFLICT DO NOTHING"
        done
    restart: "no"

  gateway-1:
    <<: *gateway-common
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DEPLOYMENT: ${DEPLOYMENT:-gw}
      PORT: 8443
      ACCOUNT_POOL_MODE: ${ACCOUNT_POOL_MODE:-poll}
      SKIP_BOOT_REFRESH: ${SKIP_BOOT_REFRESH:-0}
    volumes:
      - type: bind
        source: ./config.yaml
        target: /app/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - ./logs/gateway-1:/var/log/cc-gateway

  gateway-2:
    <<: *gateway-common
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DEPLOYMENT: ${DEPLOYMENT:-gw}
      PORT: 8443
      ACCOUNT_POOL_MODE: ${ACCOUNT_POOL_MODE:-poll}
      SKIP_BOOT_REFRESH: ${SKIP_BOOT_REFRESH:-0}
    volumes:
      - type: bind
        source: ./config.yaml
        target: /app/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - ./logs/gateway-2:/var/log/cc-gateway

  gateway-3:
    <<: *gateway-common
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DEPLOYMENT: ${DEPLOYMENT:-gw}
      PORT: 8443
      ACCOUNT_POOL_MODE: ${ACCOUNT_POOL_MODE:-poll}
      SKIP_BOOT_REFRESH: ${SKIP_BOOT_REFRESH:-0}
    volumes:
      - type: bind
        source: ./config.yaml
        target: /app/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - ./logs/gateway-3:/var/log/cc-gateway

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      gateway-1:
        condition: service_healthy
      gateway-2:
        condition: service_healthy
      gateway-3:
        condition: service_healthy
    ports:
      - "18443:18443"
    volumes:
      - ./nginx/gateway-lb.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:18443/_health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nginx:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DEPLOYMENT: ${DEPLOYMENT:-gw}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-cc_gateway}
      DB_USER: ${POSTGRES_USER:-cc_gateway}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-password}
      DB_MAX_CONNECTIONS: 15
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-cc-gateway-jwt-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-cc-gateway-refresh-secret-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      APP_URL: ${APP_URL:-http://localhost:5173}
      GATEWAY_HEALTH_URL: ${GATEWAY_HEALTH_URL:-http://nginx:18443/_health}
      GATEWAY_RELOAD_URL: ${GATEWAY_RELOAD_URL:-http://nginx:18443/_reload}
      GATEWAY_INTERNAL_URL: ${GATEWAY_INTERNAL_URL:-http://nginx:18443}
      NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-0}
      CURL_IMPERSONATE_BIN: ${CURL_IMPERSONATE_BIN:-/usr/local/bin/curl_chrome145}
    ports:
      - "${SERVER_BIND:-127.0.0.1}:${SERVER_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: ghcr.io/mike-acb/cc-gateway-web:latest
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-5173}:80"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
